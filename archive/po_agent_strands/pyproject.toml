[project]
name = "po-agent-strands"
version = "0.1.0"
description = "PO_Agent rewritten on Strands Agents: a multi-agent Jira/PM assistant CLI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.1,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "requests>=2.32",
    "sse-starlette>=2",
    "strands-agents[anthropic,openai]>=1.57",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "markdown>=3.6",
    "playwright>=1.47",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "my-po-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "requests>=2.32",
    "strands-agents[anthropic,openai]==1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]